services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment below for GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.2
      - EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/data/chroma
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  chroma_data:
